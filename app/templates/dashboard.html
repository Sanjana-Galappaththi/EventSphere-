<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - EventSphere</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="/">EventSphere</a>
        <a href="/" class="btn btn-outline-light btn-sm">Back to Events</a>
    </div>
</nav>

<div class="container">
    <h3 class="mb-4">Organiser Dashboard</h3>
    
    <!-- Stats -->
    <div class="row mb-4">
        <div class="col-md-4">
            <div class="card text-white bg-primary p-3">
                <h5>Total Revenue</h5>
                <h2 id="stat-revenue">$0.00</h2>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card text-white bg-success p-3">
                <h5>Tickets Sold</h5>
                <h2 id="stat-tickets">0</h2>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card text-white bg-info p-3">
                <h5>Total Check-ins</h5>
                <h2 id="stat-checkins">0</h2>
            </div>
        </div>
    </div>

    <!-- Admin Forms -->
    <div class="row mb-4">
        <div class="col-md-6">
            <div class="card p-3 shadow-sm">
                <h5>Create Venue</h5>
                <input type="text" id="v-name" class="form-control mb-2" placeholder="Venue Name">
                <input type="text" id="v-location" class="form-control mb-2" placeholder="Location">
                <input type="number" id="v-capacity" class="form-control mb-2" placeholder="Capacity">
                <input type="number" id="v-rate" class="form-control mb-2" placeholder="Hourly Rate">
                <button class="btn btn-primary w-100" onclick="createVenue()">Add Venue</button>
            </div>
        </div>
        <div class="col-md-6">
            <div class="card p-3 shadow-sm">
                <h5>Create Event</h5>
                <input type="text" id="e-title" class="form-control mb-2" placeholder="Event Title">
                <input type="number" id="e-venue" class="form-control mb-2" placeholder="Venue ID (e.g. 1)">
                <input type="datetime-local" id="e-start" class="form-control mb-2">
                <input type="datetime-local" id="e-end" class="form-control mb-2">
                <button class="btn btn-success w-100" onclick="createEvent()">Add Event</button>
            </div>
        </div>
    </div>

    <!-- Agent Logs -->
    <h4>Agent Message Logs</h4>
    <div class="card shadow-sm">
        <div class="card-body p-0">
            <table class="table table-striped mb-0">
                <thead>
                    <tr>
                        <th>Time</th>
                        <th>Conversation ID</th>
                        <th>Sender</th>
                        <th>Receiver</th>
                        <th>Performative</th>
                        <th>Content</th>
                    </tr>
                </thead>
                <tbody id="logs-table">
                    <tr><td colspan="6" class="text-center">Loading logs...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    // Your new Admin Token is pasted here
    const ADMIN_TOKEN = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJleHAiOjE3OTQ3NTk3ODYsInN1YiI6IjEifQ.yfr3v3fkyjeDZnuqg5aKFWMMDsMPxFZvE9rihy5ui2c";

    async function loadStats() {
        const res = await fetch('/api/dashboard/stats', { headers: { 'Authorization': `Bearer ${ADMIN_TOKEN}` } });
        if (!res.ok) return;
        const data = await res.json();
        document.getElementById('stat-revenue').innerText = `$${(data.total_revenue_cents / 100).toFixed(2)}`;
        document.getElementById('stat-tickets').innerText = data.tickets_sold;
        document.getElementById('stat-checkins').innerText = data.total_checkins;
    }

    async function loadLogs() {
        const res = await fetch('/api/dashboard/logs', { headers: { 'Authorization': `Bearer ${ADMIN_TOKEN}` } });
        if (!res.ok) return;
        const logs = await res.json();
        const tbody = document.getElementById('logs-table');
        tbody.innerHTML = '';
        logs.forEach(log => {
            tbody.innerHTML += `
                <tr>
                    <td>${new Date(log.time).toLocaleTimeString()}</td>
                    <td><code>${log.conversation_id.substring(0, 8)}...</code></td>
                    <td><strong>${log.sender}</strong></td>
                    <td><strong>${log.receiver}</strong></td>
                    <td><span class="badge bg-secondary">${log.performative}</span></td>
                    <td class="text-truncate" style="max-width: 300px;">${log.content}</td>
                </tr>
            `;
        });
    }

    async function createVenue() {
        const name = document.getElementById('v-name').value;
        const location = document.getElementById('v-location').value;
        const capacity = document.getElementById('v-capacity').value;
        const rate = document.getElementById('v-rate').value;

        if (!name || !location || !capacity || !rate) {
            alert("❌ Please fill in all Venue fields.");
            return;
        }

        try {
            const res = await fetch('/api/venues/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${ADMIN_TOKEN}` },
                body: JSON.stringify({ name, location, capacity: parseInt(capacity), hourly_rate: parseFloat(rate), is_available_for_hire: true })
            });
            if (res.ok) {
                alert("✅ Venue Created! Note the Venue ID.");
                window.location.reload();
            } else {
                const data = await res.json();
                alert("❌ Error: " + JSON.stringify(data.detail));
            }
        } catch (err) {
            alert("❌ Failed to connect.");
        }
    }

    async function createEvent() {
        const title = document.getElementById('e-title').value;
        const venue_id = document.getElementById('e-venue').value;
        const start_time = document.getElementById('e-start').value;
        const end_time = document.getElementById('e-end').value;

        if (!title || !venue_id || !start_time || !end_time) {
            alert("❌ Please fill in all Event fields.");
            return;
        }

        try {
            const res = await fetch('/api/events/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${ADMIN_TOKEN}` },
                body: JSON.stringify({
                    title: title, category: "general", venue_id: parseInt(venue_id),
                    start_time: start_time, end_time: end_time,
                    ticket_categories: [{ name: "General", price: 1000, quantity: 50 }]
                })
            });
            
            const data = await res.json();
            
            if (res.ok) {
                alert("✅ Event Created successfully!");
                window.location.reload();
            } else {
                alert("❌ Backend Error: " + JSON.stringify(data.detail));
            }
        } catch (err) {
            alert("❌ Failed to connect.");
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
        loadStats();
        loadLogs();
    });
</script>
</body>
</html>
