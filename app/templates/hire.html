<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hire Venue - EventSphere</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="/">EventSphere</a>
        <a href="/" class="btn btn-outline-light btn-sm">Back to Events</a>
    </div>
</nav>
<div class="container" style="max-width: 600px;">
    <h3 class="mb-4">Request Private Venue Hire</h3>
    <div class="card p-4 shadow-sm">
        <div id="hire-result" class="mb-3"></div>
        <label class="form-label">Venue ID</label>
        <input type="number" id="hire-venue" class="form-control mb-2" placeholder="e.g. 1" required>
        <label class="form-label">Start Time</label>
        <input type="datetime-local" id="hire-start" class="form-control mb-2" required>
        <label class="form-label">End Time</label>
        <input type="datetime-local" id="hire-end" class="form-control mb-2" required>
        <label class="form-label">Purpose</label>
        <input type="text" id="hire-purpose" class="form-control mb-2" placeholder="e.g. Birthday Party" required>
        <label class="form-label">Guest Count</label>
        <input type="number" id="hire-guests" class="form-control mb-3" placeholder="e.g. 50" required>
        <button class="btn btn-warning w-100" onclick="requestHire()">Request Hire</button>
    </div>
</div>
<script>
    async function requestHire() {
        const token = localStorage.getItem('access_token');
        if (!token) {
            alert("Please login first to request a hire.");
            window.location.href = '/login';
            return;
        }

        const venue_id = document.getElementById('hire-venue').value;
        const start_time = document.getElementById('hire-start').value;
        const end_time = document.getElementById('hire-end').value;
        const purpose = document.getElementById('hire-purpose').value;
        const guest_count = document.getElementById('hire-guests').value;
        const resultDiv = document.getElementById('hire-result');

        const res = await fetch('/api/hire/', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
            body: JSON.stringify({
                venue_id: parseInt(venue_id),
                start_time: start_time,
                end_time: end_time,
                purpose: purpose,
                guest_count: parseInt(guest_count)
            })
        });

        const data = await res.json();
        
        if (res.ok) {
            resultDiv.innerHTML = `
                <div class="alert alert-success">
                    <strong>Hire Approved!</strong><br>
                    Price: $${data.quoted_price}<br>
                    Status: ${data.status}
                </div>`;
        } else if (res.status === 409) {
            let alt = data.detail.alternatives[0];
            resultDiv.innerHTML = `
                <div class="alert alert-warning">
                    <strong>Venue Clash: ${data.detail.message}</strong><br>
                    Alternative suggested by VenueAgent:<br>
                    Venue: ${alt.venue_name}<br>
                    Time: ${new Date(alt.start_time).toLocaleString()} - ${new Date(alt.end_time).toLocaleString()}<br>
                    Estimated Price: $${alt.estimated_price}
                </div>`;
        } else {
            resultDiv.innerHTML = `<div class="alert alert-danger">${data.detail}</div>`;
        }
    }
</script>
</body>
</html>
