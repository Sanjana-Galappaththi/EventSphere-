<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EventSphere</title>
    <!-- Bootstrap CSS for mobile-friendly design -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { padding-bottom: 70px; }
        .event-card { margin-bottom: 15px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .navbar { margin-bottom: 20px; }
    </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/">EventSphere</a>
        <a href="/scanner" class="btn btn-outline-light btn-sm">Staff Scanner</a>
    </div>
</nav>

<!-- Main Content -->
<div class="container" id="app">
    <h3 class="mb-3">Upcoming Events</h3>
    <div id="event-list" class="row">
        <!-- Events will be loaded here via JS -->
        <p class="text-muted">Loading events...</p>
    </div>
</div>

<!-- Ticket Modal -->
<div class="modal fade" id="bookModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Book Tickets</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="modal-category-id">
                <label class="form-label">Quantity (Max 6)</label>
                <input type="number" id="modal-quantity" class="form-control mb-3" value="1" min="1" max="6">
                <button class="btn btn-primary w-100" onclick="confirmBooking()">Pay & Book</button>
                <div id="booking-result" class="mt-3"></div>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<!-- Custom JS -->
<script src="/static/js/app.js"></script>
</body>
</html>
