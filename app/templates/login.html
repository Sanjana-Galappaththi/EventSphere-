<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - EventSphere</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5" style="max-width: 400px;">
    <h3 class="text-center mb-4">EventSphere</h3>
    <div class="card p-4 shadow-sm">
        <div id="auth-result" class="mb-3"></div>
        
        <!-- Login Section -->
        <div id="login-section">
            <h5 class="mb-3">Sign In</h5>
            <input type="email" id="login-email" class="form-control mb-2" placeholder="Email" value="attendee@test.com">
            <input type="password" id="login-password" class="form-control mb-3" placeholder="Password" value="password123">
            <button class="btn btn-primary w-100" onclick="login()">Login</button>
            <p class="text-center mt-3 mb-0">No account? <a href="#" onclick="toggleForms()">Register</a></p>
        </div>

        <!-- Register Section -->
        <div id="register-section" style="display: none;">
            <h5 class="mb-3">Create Account</h5>
            <input type="text" id="reg-name" class="form-control mb-2" placeholder="Full Name">
            <input type="email" id="reg-email" class="form-control mb-2" placeholder="Email">
            <input type="password" id="reg-password" class="form-control mb-3" placeholder="Password">
            <button class="btn btn-success w-100" onclick="register()">Register</button>
            <p class="text-center mt-3 mb-0">Have an account? <a href="#" onclick="toggleForms()">Login</a></p>
        </div>
    </div>
</div>

<script>
    function toggleForms() {
        const l = document.getElementById('login-section');
        const r = document.getElementById('register-section');
        l.style.display = l.style.display === 'none' ? 'block' : 'none';
        r.style.display = r.style.display === 'none' ? 'block' : 'none';
    }

    async function login() {
        const email = document.getElementById('login-email').value;
        const password = document.getElementById('login-password').value;
        const formData = new URLSearchParams();
        formData.append('username', email);
        formData.append('password', password);

        const res = await fetch('/api/auth/login', { method: 'POST', body: formData });
        const data = await res.json();
        if (res.ok) {
            localStorage.setItem('access_token', data.access_token);
            window.location.href = '/';
        } else {
            document.getElementById('auth-result').innerHTML = `<div class="alert alert-danger">${data.detail}</div>`;
        }
    }

    async function register() {
        const name = document.getElementById('reg-name').value;
        const email = document.getElementById('reg-email').value;
        const password = document.getElementById('reg-password').value;

        const res = await fetch('/api/auth/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ full_name: name, email: email, password: password })
        });
        const data = await res.json();
        if (res.ok) {
            document.getElementById('auth-result').innerHTML = `<div class="alert alert-success">Registered! Please login.</div>`;
            toggleForms();
        } else {
            document.getElementById('auth-result').innerHTML = `<div class="alert alert-danger">${data.detail}</div>`;
        }
    }
</script>
</body>
</html>
