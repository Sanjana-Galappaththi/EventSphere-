<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scanner - EventSphere</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        #reader { width: 100%; max-width: 500px; margin: auto; }
    </style>
</head>
<body class="bg-light">
<div class="container mt-4">
    <h3 class="text-center mb-3">Gate Scanner</h3>
    
    <!-- Camera Scanner -->
    <div id="reader"></div>
    
    <!-- Manual Entry Fallback -->
    <div class="mt-4">
        <label class="form-label">Manual Code Entry</label>
        <div class="input-group">
            <input type="text" id="manual-code" class="form-control" placeholder="Enter QR Code">
            <button class="btn btn-primary" onclick="scanTicket()">Scan</button>
        </div>
    </div>
    
    <div id="scan-result" class="mt-4"></div>
</div>

<!-- HTML5 QR Code Library -->
<script src="https://unpkg.com/html5-qrcode"></script>
<script>
    // Your Admin Token is pasted here
    const ADMIN_TOKEN = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJleHAiOjE3OTQ3NTk3ODYsInN1YiI6IjEifQ.yfr3v3fkyjeDZnuqg5aKFWMMDsMPxFZvE9rihy5ui2c";

    // Initialize camera scanner
    function onScanSuccess(decodedText, decodedResult) {
        document.getElementById('manual-code').value = decodedText;
        scanTicket();
    }
    
    let html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: 250 });
    html5QrcodeScanner.render(onScanSuccess);

    // Send scan to backend
    async function scanTicket() {
        const code = document.getElementById('manual-code').value;
        if (!code) return;
        
        const resultDiv = document.getElementById('scan-result');
        resultDiv.innerHTML = 'Scanning...';

        try {
            const response = await fetch('/api/tickets/scan', {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${ADMIN_TOKEN}`
                },
                body: JSON.stringify({ qr_code: code, event_id: 1 }) 
            });
            
            const data = await response.json();
            
            if (response.ok) {
                resultDiv.innerHTML = `<div class="alert alert-success"><strong>ADMIT</strong><br>${data.attendee}</div>`;
            } else {
                resultDiv.innerHTML = `<div class="alert alert-danger"><strong>REFUSED</strong><br>${data.detail}</div>`;
            }
        } catch (err) {
            resultDiv.innerHTML = `<div class="alert alert-danger">Error connecting to server.</div>`;
        }
    }
</script>
</body>
</html>
